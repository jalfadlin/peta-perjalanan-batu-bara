<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Peta Bongkar Muat Cirebon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: peta memenuhi seluruh bingkai (siap di-embed); kontrol, penanda waktu, inset dan panel data melayang di atasnya. Gaya terang ala grafik peta Reuters. */
:root{
  --bg:#ffffff; --land:#c9c9c6; --land-edge:#aeaeaa; --ink:#1b1b1b; --ink2:#5f5f5f; --ink3:#8c8c8c; --line:#dcdcda;
  --coal:#b10f2a; --other:#e8a4ad; --box:#111111;
  --font:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);overflow:hidden}
.stage{position:relative;width:100%;height:100%;min-height:320px;background:var(--bg);overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:.6}
.lane{fill:none;stroke:#9d9d99;stroke-width:1;stroke-dasharray:2 5}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round}
.pname{font:600 11px var(--font);letter-spacing:.05em;fill:#2a2a2a}
.psub{font:400 10px var(--font);fill:var(--ink2)}
.sea{font:italic 400 13px var(--font);fill:#8a8a86;letter-spacing:.04em}
.reg{font:400 11px var(--font);fill:#7a7a76;letter-spacing:.14em}
.sname{font:600 9.5px var(--font);fill:#7a0a1d}
.date{position:absolute;left:0;top:0;background:var(--box);color:#fff;font:600 14px/1 var(--font);padding:9px 12px;z-index:3;max-width:calc(100% - 230px)}
.stats{position:absolute;left:10px;top:44px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 230px)}
.stat{background:#ffffffe6;border:1px solid var(--line);padding:5px 9px;min-width:84px}
.stat b{display:block;font:600 19px/1.1 var(--font);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2)}
.stat.c b{color:var(--coal)}
.inset{position:absolute;right:10px;top:10px;width:190px;background:#fff;border:1px solid var(--line);z-index:2}
.inset svg{display:block;width:100%;height:auto}
.legend{position:absolute;right:10px;bottom:calc(var(--foot,30px) + 58px);display:grid;gap:5px;font-size:12px;color:var(--ink2);background:#ffffffe6;border:1px solid var(--line);padding:8px 10px;z-index:2}
.legend div{display:flex;align-items:center;gap:8px}
.bar{position:absolute;left:0;right:0;bottom:var(--foot,30px);display:flex;gap:8px;align-items:center;padding:8px 10px;background:#ffffffee;border-top:1px solid var(--line);z-index:3;flex-wrap:wrap}
.bar input[type=range]{flex:1;min-width:140px;accent-color:var(--coal)}
button,select{font:600 12.5px var(--font);background:#fff;color:var(--ink);border:1px solid #b9b9b6;padding:6px 11px;cursor:pointer;border-radius:2px}
button:hover{background:#f3f3f2}
button.primary{background:var(--box);color:#fff;border-color:var(--box)}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--coal);outline-offset:2px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #bdbdba;box-shadow:0 2px 8px #0002;padding:8px 10px;font-size:12px;max-width:250px;display:none;z-index:4}
.tip b{display:block;font-size:13px;color:var(--coal);margin-bottom:2px}
.tip span{color:var(--ink2)}
.modal{position:absolute;inset:0;background:#fff;z-index:6;display:none;flex-direction:column;padding:12px}
.modal.on{display:flex}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mh h2{margin:0;font:600 16px var(--font)}
.mh p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.tw{flex:1;min-height:0;overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eee;white-space:nowrap}
th{position:sticky;top:0;background:#f3f3f2;color:var(--ink2);font-weight:600;z-index:1}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fbeff1}
tfoot td{position:sticky;bottom:0;background:#f3f3f2;font-weight:600}
.cc{color:var(--coal);font-weight:600}
@media(max-width:640px){.inset{width:128px}.date{font-size:12px;max-width:calc(100% - 140px)}.stats{max-width:calc(100% - 140px)}.stat{min-width:70px}.legend{display:none}}
.foot{position:absolute;left:0;right:0;bottom:0;min-height:var(--foot,30px);display:flex;align-items:center;padding:5px 10px;background:#f4f4f3;border-top:1px solid var(--line);font-size:11px;line-height:1.3;color:var(--ink2);z-index:3}
@media(max-width:640px){:root{--foot:52px}}
</style>

  for(let j=0;j<=SEG;j++){const a=at(s.route,Math.max(0,f-L*(SEG-j)/SEG));const pt=[a.x+nx,a.y+ny];
   if(prev)tr+=`<line x1="${prev[0].toFixed(1)}" y1="${prev[1].toFixed(1)}" x2="${pt[0].toFixed(1)}" y2="${pt[1].toFixed(1)}" stroke="${col}" stroke-width="${(w*(.25+.75*j/SEG)).toFixed(2)}" stroke-linecap="round" opacity="${(.25+.75*j/SEG).toFixed(2)}"/>`;prev=pt}
  const x=q.x+nx,y=q.y+ny;
  sh+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.coal?2.4:1.5}" fill="${col}"/>`;
  if(s.coal)sh+=`<text x="${(x+7).toFixed(1)}" y="${(y-7).toFixed(1)}" class="sname halo">${s.ship}</text>`;
  pos.push({x,y,s});
 }
 $('trails').innerHTML=tr;$('ships').innerHTML=sh;$('pulses').innerHTML=pl;
 $('date').textContent=fmtL(now);
 $('s-way').textContent=way;$('s-arr').textContent=arr+' / 75';$('s-coal').textContent=coal+' / 34';$('s-ton').textContent=nf.format(ton);
 $('scrub').value=Math.round((now-T0)/(T1-T0)*1000);
 const done={};ships.forEach(s=>{if(now>=s.arr){done['o'+s.from_]=(done['o'+s.from_]||0)+1;done['b'+s.to]=(done['b'+s.to]||0)+1}});
 for(const key in subEls){const e=subEls[key];e.textContent=(key[0]==='o'?'kapal berangkat ':'kapal tiba ')+(done[key]||0)+' dari '+e.dataset.n}
}
// coal table with every column from the sheet
const coalShips=ships.filter(s=>s.coal);
const NUM=new Set([0,13,14,15,17]);
const HD=D.hdr.map(h=>h.charAt(0)+h.slice(1).toLowerCase().replace('ntpn','NTPN').replace('pkk','PKK').replace('lk3','LK3').replace('spb','SPB').replace('m3','M3'));
const HDn=['No','Nomor PKK','Nomor LK3','Nomor SPB','Kapal','Perusahaan','Jenis kapal','Trayek','Berangkat dari','Tanggal (tiba)','Tiba sandar','Komoditi','Jenis','Ton','M3','Unit','NTPN','Nilai','Muatan'];
const tot=coalShips.reduce((a,s)=>a+(s.ton||0),0),totv=coalShips.reduce((a,s)=>a+(+s.full[17]||0),0);
$('msub').textContent=coalShips.length+' kapal | total '+nf.format(tot)+' ton | klik baris untuk memutar pelayarannya';
$('ctab').innerHTML='<thead><tr>'+HDn.map((h,i)=>`<th class="${NUM.has(i)?'r':''}">${h}</th>`).join('')+'</tr></thead><tbody>'+coalShips.map((s,ri)=>`<tr tabindex="0" data-i="${s.id}">`+s.full.map((v,i)=>{let x=v;if(NUM.has(i)&&i>0&&!isNaN(+v))x=nf.format(+v);return `<td class="${NUM.has(i)?'r':''}${i===4?' cc':''}">${x}</td>`}).join('')+'</tr>').join('')+`</tbody><tfoot><tr><td colspan="13">Total ${coalShips.length} kapal</td><td class="r">${nf.format(tot)}</td><td></td><td></td><td></td><td class="r">${nf.format(totv)}</td><td></td></tr></tfoot>`;
function jump(tr){const s=ships[+tr.dataset.i];now=s.arr-36*H;playing=true;$('play').textContent='Jeda';$('modal').classList.remove('on');render()}
$('ctab').addEventListener('click',e=>{const tr=e.target.closest('tbody tr');tr&&jump(tr)});
$('ctab').addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tbody tr');tr&&jump(tr)}});
$('open').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('on')});
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(playing){now+=dt*speed*H;if(now>=T1){now=T1;playing=false;$('play').textContent='Putar ulang'}render()}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(now>=T1)now=T0;playing=!playing;$('play').textContent=playing?'Jeda':'Putar';render()};
$('restart').onclick=()=>{now=T0;playing=true;$('play').textContent='Jeda';render()};
$('speed').onchange=e=>speed=+e.target.value;
$('scrub').oninput=e=>{now=T0+(+e.target.value)/1000*(T1-T0);render()};
const tip=$('tip'),svg=$('map'),stage=$('stage');
svg.addEventListener('pointermove',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=pt.matrixTransform(svg.getScreenCTM().inverse());
 let best=null,bd=14;for(const p of pos){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<bd){bd=d;best=p}}
 if(!best){tip.style.display='none';return}
 const s=best.s,r=stage.getBoundingClientRect(),f=s.full;
 tip.innerHTML=`<b>${s.ship}</b><span>${f[6]}<br>${s.from_} ke ${berths[s.to].name}<br>Tiba ${fmtS(s.arr)} WIB<br>${s.coal?'Batu bara, '+nf.format(s.ton)+' ton<br>'+f[5]:'Tidak ada komoditi tercatat'}</span>`;
 tip.style.display='block';tip.style.left=Math.max(4,Math.min(e.clientX-r.left+14,r.width-260))+'px';tip.style.top=Math.max(4,Math.min(e.clientY-r.top+14,r.height-150))+'px'});
svg.addEventListener('pointerleave',()=>tip.style.display='none');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;$('play').textContent='Putar';now=Date.parse('2026-10-18T12:00:00Z')}
render();requestAnimationFrame(loop);
</script>
